name: Setup build environment
description: Java·Python 준비, 실행 권한 부여, CI 스크립트 테스트까지 공통 셋업

runs:
  using: composite
  steps:
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'

    - name: Grant execute permission
      shell: bash
      run: |
        chmod +x ./gradlew
        chmod +x ./scripts/ci/affected_modules.py

    # affected 모듈 계산이 틀리면 빌드 대상이 통째로 잘못 선별된다. Gradle 보다 먼저 검증한다.
    - name: Test CI scripts
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        pytest scripts/ci

name: Setup build environment
description: Java·Gradle·Python 준비, 실행 권한 부여, CI 스크립트 테스트까지 공통 셋업

runs:
  using: composite
  steps:
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # actions/setup-java 의 cache: gradle 대신 이 액션을 쓴다.
    # 전자는 ~/.gradle 을 통째로 한 키로 다루는 의존성 캐시라, 키(=gradle 파일 해시)가 그대로면
    # 저장을 건너뛴다 → 그 실행에서 만든 build cache 항목이 유실된다.
    # 이 액션은 Gradle 전용이라 build cache 항목을 증분 저장하고 stale 항목을 정리한다.
    #
    # cache-read-only 는 기본값(기본 브랜치가 아니면 읽기 전용)을 쓴다.
    # PR 브랜치마다 수백 MB 캐시가 쌓이는 것을 막고, PR 은 main 캐시를 읽기만 한다.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'

    - name: Grant execute permission
      shell: bash
      run: |
        chmod +x ./gradlew
        chmod +x ./scripts/ci/affected_modules.py

    # affected 모듈 계산이 틀리면 빌드 대상이 통째로 잘못 선별된다. Gradle 보다 먼저 검증한다.
    - name: Test CI scripts
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        pytest scripts/ci

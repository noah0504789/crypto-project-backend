name: Backend CD

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Deploy target service"
        required: true
        type: choice
        options:
          - crypto-spring-cloud-config
          - crypto-spring-cloud-eureka-server
          - crypto-spring-cloud-api-gateway
          - crypto-websocket-gateway
          - crypto-oauth2-authorization-server
          - crypto-oauth2-client
          - crypto-chat-service
          - crypto-user-service
          - crypto-market-service
          - crypto-notification-service
          - crypto-outbox-poller
          - crypto-market-detection
          - crypto-upbit-connector

      image_tag:
        description: "Docker image tag to deploy"
        required: true
        default: "latest"

      scale:
        description: "Target container scale for blue/green services"
        required: true
        type: choice
        default: "current"
        options:
          - current
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy backend service
    runs-on: [self-hosted, local, backend]
    environment: production

    steps:
      - name: Print deploy inputs
        run: |
          echo "Production CD approved"
          echo "Runner hostname: $(hostname)"
          echo "Runner user: $(whoami)"
          echo "Target service: ${{ inputs.service }}"
          echo "Image tag: ${{ inputs.image_tag }}"
          echo "Target scale: ${{ inputs.scale }}"
          date

      - name: Validate Docker access
        run: |
          docker --version
          docker compose version

      - name: Update infra repository
        env:
          INFRA_REPO_DIR: ${{ vars.INFRA_REPO_DIR }}
        run: |
          set -euo pipefail

          if [ -z "${INFRA_REPO_DIR:-}" ]; then
            echo "ERROR: INFRA_REPO_DIR variable is empty."
            exit 1
          fi

          cd "$INFRA_REPO_DIR"
          git pull --ff-only

      - name: Deploy selected service
        env:
          INFRA_REPO_DIR: ${{ vars.INFRA_REPO_DIR }}
          CONFIG_REPO_URI: ${{ vars.CONFIG_REPO_URI }}

          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}

          TARGET_SERVICE: ${{ inputs.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          TARGET_SCALE: ${{ inputs.scale }}
        run: |
          set -euo pipefail

          if [ -z "${INFRA_REPO_DIR:-}" ]; then
            echo "ERROR: INFRA_REPO_DIR variable is empty."
            exit 1
          fi

          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "ERROR: DOCKERHUB_USERNAME secret is empty."
            exit 1
          fi

          if [ -z "${TARGET_SERVICE:-}" ]; then
            echo "ERROR: TARGET_SERVICE input is empty."
            exit 1
          fi

          if [ -z "${IMAGE_TAG:-}" ]; then
            echo "ERROR: IMAGE_TAG input is empty."
            exit 1
          fi

          if [ -z "${TARGET_SCALE:-}" ]; then
            echo "ERROR: TARGET_SCALE input is empty."
            exit 1
          fi

          if [ "$TARGET_SCALE" != "current" ] && \
             ! echo "$TARGET_SCALE" | grep -Eq '^[0-9]+$'; then
            echo "ERROR: TARGET_SCALE must be 'current' or a positive integer. value=$TARGET_SCALE"
            exit 1
          fi

          if [ "$TARGET_SCALE" != "current" ] && \
             [ "$TARGET_SCALE" -lt 1 ]; then
            echo "ERROR: TARGET_SCALE must be greater than 0. value=$TARGET_SCALE"
            exit 1
          fi

          cd "$INFRA_REPO_DIR/service"

          if [ -f .env ]; then
            set -a
            . ./.env
            set +a
          fi

          case "$TARGET_SERVICE" in
            crypto-spring-cloud-config)
              echo "Scale input is ignored for Spring Cloud Config validated recreate deployment."
              ./scripts/deploy/deploy-spring-cloud-config-validated-recreate.sh \
                "$IMAGE_TAG"
              ;;

            crypto-spring-cloud-eureka-server)
              echo "Scale input is ignored for Eureka Server validated recreate deployment."
              ./scripts/deploy/deploy-eureka-server-validated-recreate.sh \
                "$IMAGE_TAG"
              ;;

            crypto-spring-cloud-api-gateway)
              echo "Scale input is ignored for API Gateway validated recreate deployment."
              ./scripts/deploy/deploy-api-gateway-validated-recreate.sh \
                "$IMAGE_TAG"
              ;;

            crypto-oauth2-authorization-server)
              echo "Scale input is ignored for OAuth2 Authorization Server validated recreate deployment."
              ./scripts/deploy/deploy-oauth2-authorization-server-validated-recreate.sh \
                "$IMAGE_TAG"
              ;;

            crypto-oauth2-client)
              echo "Scale input is ignored for OAuth2 Client validated recreate deployment."
              ./scripts/deploy/deploy-oauth2-client-validated-recreate.sh \
                "$IMAGE_TAG"
              ;;

            crypto-outbox-poller)
              echo "Scale input is ignored for crypto-outbox-poller safe recreate deployment."
              ./scripts/deploy/deploy-outbox-poller-safe.sh \
                "$IMAGE_TAG"
              ;;

            crypto-market-detection)
              echo "Scale input is ignored for crypto-market-detection safe recreate deployment."
              ./scripts/deploy/deploy-market-detection-safe.sh \
                "$IMAGE_TAG"
              ;;

            crypto-upbit-connector)
              echo "Scale input is ignored for crypto-upbit-connector safe recreate deployment."
              ./scripts/deploy/deploy-upbit-connector-safe.sh \
                "$IMAGE_TAG"
              ;;

            crypto-user-service)
              ./scripts/deploy/deploy-user-service-bluegreen.sh \
                "$IMAGE_TAG" \
                "$TARGET_SCALE"
              ;;

            crypto-market-service)
              ./scripts/deploy/deploy-market-service-bluegreen.sh \
                "$IMAGE_TAG" \
                "$TARGET_SCALE"
              ;;

            crypto-notification-service)
              ./scripts/deploy/deploy-notification-service-bluegreen.sh \
                "$IMAGE_TAG" \
                "$TARGET_SCALE"
              ;;

            crypto-websocket-gateway)
              ./scripts/deploy/deploy-websocket-gateway-bluegreen.sh \
                "$IMAGE_TAG" \
                "$TARGET_SCALE"
              ;;

            crypto-chat-service)
              ./scripts/deploy/deploy-chat-service-bluegreen.sh \
                "$IMAGE_TAG" \
                "$TARGET_SCALE"
              ;;

            *)
              echo "Unknown service: $TARGET_SERVICE"
              exit 1
              ;;
          esac
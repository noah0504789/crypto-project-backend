name: Backend CD

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Deploy target service"
        required: true
        type: choice
        options:
          - crypto-spring-cloud-api-gateway
          - crypto-websocket-gateway
          - crypto-oauth2-authorization-server
          - crypto-oauth2-client
          - crypto-chat-service
          - crypto-user-service
          - crypto-outbox-poller
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        default: "latest"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy backend service
    runs-on: [self-hosted, local, backend]
    environment: production

    steps:
      - name: Print deploy inputs
        run: |
          echo "Production CD approved"
          echo "Runner hostname: $(hostname)"
          echo "Runner user: $(whoami)"
          echo "Target service: ${{ inputs.service }}"
          echo "Image tag: ${{ inputs.image_tag }}"
          date

      - name: Validate Docker access
        run: |
          docker --version
          docker compose version

      - name: Update infra repository
        env:
          INFRA_REPO_DIR: ${{ vars.INFRA_REPO_DIR }}
        run: |
          set -euo pipefail

          if [ -z "${INFRA_REPO_DIR:-}" ]; then
            echo "ERROR: INFRA_REPO_DIR variable is empty."
            exit 1
          fi

          cd "$INFRA_REPO_DIR"
          git pull --ff-only

      - name: Deploy selected service
        env:
          INFRA_REPO_DIR: ${{ vars.INFRA_REPO_DIR }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TARGET_SERVICE: ${{ inputs.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if [ -z "${INFRA_REPO_DIR:-}" ]; then
            echo "ERROR: INFRA_REPO_DIR variable is empty."
            exit 1
          fi

          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "ERROR: DOCKERHUB_USERNAME secret is empty."
            exit 1
          fi

          cd "$INFRA_REPO_DIR/service"

          if [ -f .env ]; then
            set -a
            . ./.env
            set +a
          fi

          case "$TARGET_SERVICE" in
            crypto-outbox-poller)
              ./scripts/deploy/deploy-outbox-poller-safe.sh "$IMAGE_TAG"
              ;;

            crypto-user-service)
              ./scripts/deploy/deploy-user-service-bluegreen.sh "$IMAGE_TAG"
              ;;

            crypto-spring-cloud-api-gateway|crypto-websocket-gateway|crypto-oauth2-authorization-server|crypto-oauth2-client|crypto-chat-service)
              echo "Blue/green deploy is not implemented yet for $TARGET_SERVICE"
              exit 1
              ;;

            *)
              echo "Unknown service: $TARGET_SERVICE"
              exit 1
              ;;
          esac
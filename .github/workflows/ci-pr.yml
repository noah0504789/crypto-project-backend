name: Backend PR CI

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  # name 을 바꾸지 않는다. 룰셋 main-protection 의 required status check 가 이 이름을 참조하며,
  # 이름이 어긋나면 모든 PR 이 머지 불가가 된다.
  pull-request-ci:
    name: Affected module CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-build

      - name: Calculate affected Gradle tasks
        id: affected
        run: |
          TASKS=$(./scripts/ci/affected_modules.py \
            --base "origin/${{ github.base_ref }}" --head "${{ github.sha }}" \
            --mode build --include-arch-test)
          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          echo "Affected tasks: $TASKS"

      - name: Run affected module CI
        if: steps.affected.outputs.tasks != ''
        run: ./gradlew clean ${{ steps.affected.outputs.tasks }}

      - name: Calculate affected Docker services
        id: docker
        run: |
          SERVICES=$(./scripts/ci/affected_modules.py \
            --base "origin/${{ github.base_ref }}" --head "${{ github.sha }}" --mode docker)
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Affected Docker services: $SERVICES"

      - uses: docker/setup-buildx-action@v3
        if: steps.docker.outputs.services != ''

      # fork PR 은 시크릿을 못 받는다. 로그인 없이 빌드만 해 Dockerfile 유효성만 확인한다.
      - name: Login to DockerHub
        if: steps.docker.outputs.services != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest 는 붙이지 않는다. 아직 머지되지 않은 코드다.
      - name: Build and push PR image
        if: steps.docker.outputs.services != ''
        env:
          CAN_PUSH: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          for ITEM in ${{ steps.docker.outputs.services }}; do
            SERVICE_PATH="${ITEM%%=*}"
            IMAGE_NAME="${ITEM#*=}"
            DOCKERFILE="$SERVICE_PATH/Dockerfile"

            if [ ! -f "$DOCKERFILE" ]; then
              echo "Dockerfile not found: $DOCKERFILE"
              exit 1
            fi

            if [ "$CAN_PUSH" = "true" ]; then
              TAG="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:pr-${{ github.event.pull_request.number }}"
            else
              TAG="local/$IMAGE_NAME:pr"
            fi

            echo "Building $TAG"
            docker build -f "$DOCKERFILE" -t "$TAG" "$SERVICE_PATH"

            if [ "$CAN_PUSH" = "true" ]; then
              docker push "$TAG"
            else
              echo "fork PR 이라 push 를 건너뛴다."
            fi
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-pr
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/

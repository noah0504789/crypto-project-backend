name: Backend CI

on:
  workflow_dispatch:
    inputs:
      ci_task:
        description: 'CI task to run'
        required: true
        default: 'serviceCi'
        type: choice
        options:
          - serviceCi
      base_ref:
        description: 'Base ref for affected Docker calculation'
        required: false
        default: 'origin/main'
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  affected-ci:
    name: Affected module CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Grant execute permission
        run: |
          chmod +x ./gradlew
          chmod +x ./scripts/ci/affected_modules.py

      - name: Test CI scripts
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          pytest scripts/ci

      - name: Resolve diff range
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE="${{ inputs.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi

          HEAD="${{ github.sha }}"

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

          echo "Diff base: $BASE"
          echo "Diff head: $HEAD"

      - name: Calculate affected Gradle tasks
        if: github.event_name != 'workflow_dispatch'
        id: affected
        run: |
          TASKS=$(./scripts/ci/affected_modules.py \
            --base "${{ steps.diff.outputs.base }}" \
            --head "${{ steps.diff.outputs.head }}" \
            --mode build \
            --include-arch-test)

          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          echo "Affected tasks: $TASKS"

      - name: Run manual service CI
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${{ inputs.ci_task }}" in
            serviceCi)
              ./gradlew clean serviceCi
              ;;
            *)
              echo "Unsupported ci_task: ${{ inputs.ci_task }}"
              exit 1
              ;;
          esac

      - name: Run affected module CI
        if: github.event_name != 'workflow_dispatch' && steps.affected.outputs.tasks != ''
        run: ./gradlew clean ${{ steps.affected.outputs.tasks }}

      - name: Skip backend CI
        if: github.event_name != 'workflow_dispatch' && steps.affected.outputs.tasks == ''
        run: echo "No affected backend modules."

      - name: Calculate affected Docker services
        id: docker
        run: |
          SERVICES=$(./scripts/ci/affected_modules.py \
            --base "${{ steps.diff.outputs.base }}" \
            --head "${{ steps.diff.outputs.head }}" \
            --mode docker)

          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Affected Docker services: $SERVICES"

      - name: Set Docker metadata
        id: docker_meta
        if: steps.docker.outputs.services != ''
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.docker.outputs.services != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.docker.outputs.services != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker images
        if: steps.docker.outputs.services != ''
        run: |
          set -euo pipefail

          for ITEM in ${{ steps.docker.outputs.services }}; do
            SERVICE_PATH="${ITEM%%=*}"
            IMAGE_NAME="${ITEM#*=}"

            DOCKERFILE="$SERVICE_PATH/Dockerfile"

            if [ ! -f "$DOCKERFILE" ]; then
              echo "Dockerfile not found: $DOCKERFILE"
              exit 1
            fi

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME"
            SHA_TAG="${IMAGE}:${{ steps.docker_meta.outputs.short_sha }}"

            echo "Building Docker image: $SHA_TAG"
            echo "Dockerfile: $DOCKERFILE"
            echo "Build context: $SERVICE_PATH"

            docker build \
              -f "$DOCKERFILE" \
              -t "$SHA_TAG" \
              "$SERVICE_PATH"
          done

      - name: Push Docker images
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.docker.outputs.services != ''
        run: |
          set -euo pipefail

          for ITEM in ${{ steps.docker.outputs.services }}; do
            IMAGE_NAME="${ITEM#*=}"

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME"
            SHA_TAG="${IMAGE}:${{ steps.docker_meta.outputs.short_sha }}"
            LATEST_TAG="${IMAGE}:latest"

            echo "Tagging $SHA_TAG as $LATEST_TAG"
            docker tag "$SHA_TAG" "$LATEST_TAG"

            echo "Pushing $SHA_TAG"
            docker push "$SHA_TAG"

            echo "Pushing $LATEST_TAG"
            docker push "$LATEST_TAG"
          done

      - name: Skip Docker build
        if: steps.docker.outputs.services == ''
        run: echo "No affected Docker services."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-affected-ci
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/
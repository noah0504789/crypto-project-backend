name: Backend CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  affected-ci:
    name: Affected module CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: |
          chmod +x ./gradlew
          chmod +x ./scripts/ci/affected_modules.py

      - name: Calculate affected Gradle tasks
        id: affected
        run: |
          TASKS=$(./scripts/ci/affected_modules.py \
            --base origin/main \
            --head HEAD \
            --mode build \
            --include-arch-test)

          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          echo "Affected tasks: $TASKS"

      - name: Run affected module CI
        if: steps.affected.outputs.tasks != ''
        run: ./gradlew clean ${{ steps.affected.outputs.tasks }}

      - name: Skip backend CI
        if: steps.affected.outputs.tasks == ''
        run: echo "No affected backend modules."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-affected-ci
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/
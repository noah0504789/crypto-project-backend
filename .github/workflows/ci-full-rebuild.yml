name: Backend Full Rebuild

on:
  workflow_dispatch:
    inputs:
      ci_task:
        description: 'CI task to run'
        required: true
        default: 'serviceCi'
        type: choice
        options:
          - serviceCi
      base_ref:
        description: 'Base ref for affected Docker calculation'
        required: false
        default: 'origin/main'

permissions:
  contents: read

jobs:
  full-rebuild:
    name: Full rebuild (manual)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-build

      - name: Run service CI
        run: ./gradlew clean ${{ inputs.ci_task }}

      - name: Calculate affected Docker services
        id: docker
        run: |
          SERVICES=$(./scripts/ci/affected_modules.py \
            --base "${{ inputs.base_ref }}" --head "${{ github.sha }}" --mode docker)
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Affected Docker services: $SERVICES"

      - uses: docker/setup-buildx-action@v3
        if: steps.docker.outputs.services != ''

      - name: Login to DockerHub
        if: steps.docker.outputs.services != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        if: steps.docker.outputs.services != ''
        run: |
          set -euo pipefail

          for ITEM in ${{ steps.docker.outputs.services }}; do
            SERVICE_PATH="${ITEM%%=*}"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${ITEM#*=}"

            docker build -f "$SERVICE_PATH/Dockerfile" \
              -t "${IMAGE}:${GITHUB_SHA::7}" -t "${IMAGE}:latest" "$SERVICE_PATH"
            docker push "${IMAGE}:${GITHUB_SHA::7}"
            docker push "${IMAGE}:latest"
          done

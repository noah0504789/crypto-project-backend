plugins {
    id 'base'
}

tasks.register('checkDependencyOrder', Exec) {
    group = 'verification'
    description = 'Verifies build.gradle project dependency ordering (docs/CODE_STYLE.md §6)'
    commandLine 'python3', 'scripts/quality/dependency_order.py'
}

tasks.register('qualityCheck') {
    group = 'verification'
    description = 'Runs formatter, Java compilation, and architecture checks'
    dependsOn ':common:common-arch-test:test'
    dependsOn 'checkDependencyOrder'
}

subprojects {
    pluginManager.withPlugin('java') {
        rootProject.tasks.named('qualityCheck') {
            dependsOn tasks.named('spotlessCheck')
            dependsOn tasks.named('compileJava')
        }
    }
}

tasks.register('installGitHooks', Exec) {
    group = 'verification'
    description = 'Configures this clone to use the versioned Git hooks in .githooks'
    commandLine 'git', 'config', 'core.hooksPath', '.githooks'
}

tasks.register("serviceCi") {
    group = "verification"
    description = "Runs CI checks for all service modules"

    dependsOn(
            "chatCi",
            "websocketGatewayCi",
            "userCi",
            "oauth2AuthorizationServerCi",
            "oauth2ClientCi",
            "springCloudConfigCi",
            "gatewayCi",
            "marketCi",
            "marketDetectionCi",
            "notificationCi",
            "outboxPollerCi",
            "eurekaServerCi"
    )
}


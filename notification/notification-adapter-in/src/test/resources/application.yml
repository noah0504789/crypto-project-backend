spring:
  application:
    name: notification-service

  config:
    import: ""

  cloud:
    config:
      enabled: false
      fail-fast: false
      import-check:
        enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

api-path:
  notification:
    me: /notifications/me
    read: /notifications/{notificationId}/read

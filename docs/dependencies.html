<div id="dependency-explorer">
<style>
#dependency-explorer{font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182230;background:#f6f8fb;border:1px solid #d9e0ea;border-radius:14px;overflow:hidden}
#dependency-explorer .dx-head{padding:18px 20px;background:#fff;border-bottom:1px solid #d9e0ea;display:flex;gap:14px;align-items:end;justify-content:space-between;flex-wrap:wrap}
#dependency-explorer h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
#dependency-explorer .dx-sub{color:#617084;font-size:12px}
#dependency-explorer label{display:grid;gap:5px;color:#617084;font-size:12px}
#dependency-explorer select,#dependency-explorer button{font:inherit;border:1px solid #c8d2df;background:#fff;border-radius:8px;padding:8px 10px;color:#182230}
#dependency-explorer button{cursor:pointer}
#dependency-explorer .dx-body{display:grid;grid-template-columns:minmax(0,1fr) 250px;min-height:650px}
#dependency-explorer .dx-canvas{position:relative;min-width:0;background:#f6f8fb}
#dependency-explorer svg{display:block;width:100%;height:650px;cursor:grab}
#dependency-explorer svg:active{cursor:grabbing}
#dependency-explorer .dx-side{padding:18px;background:#fff;border-left:1px solid #d9e0ea}
#dependency-explorer .dx-side h2{font-size:14px;margin:0 0 12px}
#dependency-explorer .dx-side p{margin:8px 0;color:#617084;line-height:1.5;overflow-wrap:anywhere}
#dependency-explorer .dx-legend{display:grid;gap:8px;margin-top:20px}
#dependency-explorer .dx-legend span{display:flex;align-items:center;gap:8px;color:#617084;font-size:12px}
#dependency-explorer .swatch{width:10px;height:10px;border-radius:3px;display:inline-block}
#dependency-explorer .edge{stroke:#aeb9c8;stroke-width:1.1;opacity:.72}
#dependency-explorer .node{stroke:#fff;stroke-width:1.5;cursor:pointer}
#dependency-explorer .node-label{font-size:11px;fill:#182230;pointer-events:none}
#dependency-explorer .node.dim,.edge.dim{opacity:.14}
#dependency-explorer .node.selected{stroke:#182230;stroke-width:2.5}
@media (max-width:800px){#dependency-explorer .dx-body{grid-template-columns:1fr}#dependency-explorer .dx-side{border-left:0;border-top:1px solid #d9e0ea}#dependency-explorer svg{height:560px}}
</style>
<div class="dx-head">

  <label>서비스 필터<select id="dx-service"></select></label>
  <button id="dx-reset" type="button">전체 보기</button>
</div>
<div class="dx-body">
  <div class="dx-canvas"><svg id="dx-svg" viewBox="0 0 1200 650" role="img" aria-label="Gradle module dependency graph"></svg></div>

  </div></aside>
</div>

  const W=1200,H=650;
  const colors={app:"#4f46e5",domain:"#0f766e",bootstrap:"#c2410c",common:"#64748b",other:"#475569"};
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const kind=id=>id.includes("/common-")||id.startsWith("common/")||id==="protobuf"?"common":id.endsWith("-bootstrap")||!id.includes("/")?"bootstrap":id.endsWith("-domain")||id.endsWith("-contract")?"domain":"app";
  const label=id=>id.split("/").slice(-1)[0];
  data.services.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;select.appendChild(o)});
  const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)};
  let state={service:"*",nodes:[],edges:[],positions:new Map(),selected:null,scale:1,tx:0,ty:0};
  function visible(service){
    if(service==="*")return {nodes:data.nodes,edges:data.edges};
    const own=new Set(data.nodes.filter(n=>n.service===service).map(n=>n.id));
    const deps=new Set(data.edges.filter(e=>own.has(e.source)).map(e=>e.target));
    const ids=new Set([...own,...deps]);
    return {nodes:data.nodes.filter(n=>ids.has(n.id)),edges:data.edges.filter(e=>ids.has(e.source)&&ids.has(e.target))};
  }
  function layout(nodes){
    const byKind={common:[],domain:[],app:[],bootstrap:[]};
    nodes.forEach(n=>byKind[kind(n.id)].push(n));
    const pos=new Map();
    Object.entries(byKind).forEach(([k,list],col)=>list.forEach((n,i)=>{
      const x=130+col*300,y=70+(i+1)*(510/(list.length+1));
      const j=hash(n.id);pos.set(n.id,{x:x+(j%35)-17,y:y+((j>>4)%24)-12,vx:0,vy:0,fixed:false});
    }));
    return pos;
  }
  function simulate(){
    const nodes=state.nodes,edges=state.edges,pos=state.positions;
    for(let pass=0;pass<90;pass++){
      nodes.forEach(a=>{const p=pos.get(a.id);p.vx*=.78;p.vy*=.78});
      for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
        const a=pos.get(nodes[i].id),b=pos.get(nodes[j].id),dx=a.x-b.x,dy=a.y-b.y,d2=Math.max(400,dx*dx+dy*dy),f=1500/d2;
        a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;
      }
      edges.forEach(e=>{const a=pos.get(e.source),b=pos.get(e.target);if(!a||!b)return;const dx=b.x-a.x,dy=b.y-a.y,d=Math.max(1,Math.hypot(dx,dy)),f=(d-220)*.002;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f});
      nodes.forEach(n=>{const p=pos.get(n.id);if(!p.fixed){p.vx+=(600-p.x)*.0008;p.vy+=(325-p.y)*.0008;p.x=Math.max(45,Math.min(1155,p.x+p.vx));p.y=Math.max(35,Math.min(615,p.y+p.vy))}});
    }
  }
  function render(){

    const g=document.createElementNS("http://www.w3.org/2000/svg","g");g.setAttribute("transform",`translate(${state.tx} ${state.ty}) scale(${state.scale})`);svg.appendChild(g);
    const edgeLayer=document.createElementNS("http://www.w3.org/2000/svg","g");g.appendChild(edgeLayer);
    edges.forEach(e=>{const a=state.positions.get(e.source),b=state.positions.get(e.target);if(!a||!b)return;const line=document.createElementNS("http://www.w3.org/2000/svg","line");line.setAttribute("x1",a.x);line.setAttribute("y1",a.y);line.setAttribute("x2",b.x);line.setAttribute("y2",b.y);line.classList.add("edge");line.dataset.source=e.source;line.dataset.target=e.target;edgeLayer.appendChild(line)});
    nodes.forEach(n=>{const p=state.positions.get(n.id),group=document.createElementNS("http://www.w3.org/2000/svg","g");group.classList.add("node");group.dataset.id=n.id;const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",p.x);c.setAttribute("cy",p.y);c.setAttribute("r",n.id===state.selected?12:9);c.setAttribute("fill",colors[kind(n.id)]);const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",p.x+14);t.setAttribute("y",p.y+4);t.classList.add("node-label");t.textContent=label(n.id);group.append(c,t);group.addEventListener("click",()=>selectNode(n.id));group.addEventListener("pointerdown",ev=>drag(ev,n.id));group.classList.toggle("selected",n.id===state.selected);g.appendChild(group)});
    if(state.selected){const linked=new Set([state.selected,...edges.filter(e=>e.source===state.selected||e.target===state.selected).flatMap(e=>[e.source,e.target])]);g.querySelectorAll(".node").forEach(el=>el.classList.toggle("dim",!linked.has(el.dataset.id)));g.querySelectorAll(".edge").forEach(el=>el.classList.toggle("dim",!(el.dataset.source===state.selected||el.dataset.target===state.selected)))}
  }
  function selectNode(id){state.selected=id;const n=data.nodes.find(x=>x.id===id);const out=state.edges.filter(e=>e.source===id).map(e=>label(e.target));const incoming=state.edges.filter(e=>e.target===id).map(e=>label(e.source));title.textContent=label(id);detail.innerHTML=`<b>서비스:</b> ${esc(n.service)}<br><b>계층:</b> ${esc(kind(id))}<br><b>의존:</b> ${out.length?out.map(esc).join(", "):"없음"}<br><b>사용처:</b> ${incoming.length?incoming.map(esc).join(", "):"없음"}`;render()}

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health:
    show-details: always
    show-components: always
    probes:
      enabled: true
    group:
      readiness:
        include: readinessState,deploymentReadiness
      liveness:
        include: livenessState

deployment:
  control:
    token: ${deployment.control-token}

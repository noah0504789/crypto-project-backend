server.port: 8600

grpc:
  client:
    market-client:
      address: ${uri.discovery.market-service}
      negotiation-type: plaintext
      max-inbound-message-size:
        bytes: 16777216

spring:
  cloud:
    stream:
      output-bindings: upbitTickerEvent-out-0
      bindings:
        upbitTickerEvent-out-0:
          destination: upbit-ticker-event
          content-type: application/json
      kafka:
        bindings:
          upbitTickerEvent-out-0:
            producer:
              configuration:
                value.serializer: org.springframework.kafka.support.serializer.JsonSerializer

upbit:
  websocket:
    url: ${uri.provider.upbit.websocket}
    ticket: upbit-connector
    ticker-publish-interval: 7s
    reconnect-min-backoff: 1s
    reconnect-max-backoff: 30s

app:
  grpc:
    market-client:
      deadline: 3500ms

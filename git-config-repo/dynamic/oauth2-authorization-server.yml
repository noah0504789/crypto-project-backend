server:
  port: 9000
  # TODO: tsl

grpc:
  client:
    user-client:
      address: ${uri.discovery.user-service}
      negotiation-type: plaintext
      max-inbound-message-size:
        bytes: 16777216 # 16MB
  server:
    port: 19000

oauth2:
  registered-client:
    id: ${my.client-id}
    secret: ${my.client-secret}
    registration-id: ${my.client-registration-id}

#logging:
#  level:
#    org.springframework.security.oauth2.server.authorization: DEBUG
#    org.springframework.security.oauth2: DEBUG

app:
  grpc:
    user-client:
      deadline: 3500ms

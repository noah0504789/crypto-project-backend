server:
  port: 8080
  version: v1
  servlet:
    context-path: /api/${server.version}
    encoding:
      charset: UTF-8
      force: true

grpc:
  server:
    port: 18080

api-path:
  chat:
    base: ${api-contract.chat.base}
    rooms-popular: ${api-contract.chat.rooms-popular}
    rooms-me: ${api-contract.chat.rooms-me}
    room: ${api-contract.chat.room}
    room-me: ${api-contract.chat.room-me}
    room-members: ${api-contract.chat.room-members}
    room-activity: ${api-contract.chat.room-activity}
    room-create: ${api-contract.chat.room-create}
    room-messages: ${api-contract.chat.room-messages}

spring:
  messages:
    basename: messages,common-validation-messages
    encoding: UTF-8
  jpa:
#    show-sql: true
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
#        generate_statistics: true
        format_sql: true
        use_sql_comments: true
    defer-datasource-initialization: true
    open-in-view: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  cloud:
    function:
      definition: chatRoomEventConsumer;chatMessageEventConsumer;chatRoomDlqEventConsumer;chatMessageDlqEventConsumer
    stream:
      bindings:
        chatRoomEventConsumer-in-0:
          destination: chatroom-event
          contentType: application/json
          group: chat
        chatMessageEventConsumer-in-0:
          destination: chatmessage-event
          contentType: application/json
          group: chat
        chatRoomDlqEventConsumer-in-0:
          destination: chatroom-event.dlq
          contentType: application/json
          group: chat
        chatMessageDlqEventConsumer-in-0:
          destination: chatmessage-event.dlq
          contentType: application/json
          group: chat
      kafka:
        binder:
          consumer-properties:
            spring.json.trusted.packages: "*"
        bindings:
          chatRoomEventConsumer-in-0:
            consumer:
              reset-offsets: false
              start-offset: latest
              ack-mode: record
          chatMessageEventConsumer-in-0:
            consumer:
              reset-offsets: false
              start-offset: latest
              ack-mode: batch
              batch-mode: true
          chatRoomDlqEventConsumer-in-0:
            consumer:
              reset-offsets: false
              start-offset: latest
              ack-mode: record
          chatMessageDlqEventConsumer-in-0:
            consumer:
              reset-offsets: false
              start-offset: latest
              ack-mode: record

mysql:
  username: ${mysql.event.username}
  password: ${mysql.event.password}
  db: ${mysql.event.db}
  write:
    # chat 은 @Entity 가 없다. 이 pool 은 outbox 기록 전용이고, 메시지 1건이 행 3건을 만들지만
    # 한 트랜잭션이라 커넥션은 1건이다. 배분 근거는 ADR-003 의 커넥션 예산 표.
    pool:
      max-size: 30
      min-idle: 30
      connection-timeout: 3500

mongo:
  user: ${mongo.chat.username}
  pass: ${mongo.chat.password}
  db: ${mongo.chat.db}
  authSource: chat

chat:
  cache:
    # 방 정보 hash 의 Redis TTL
    room-ttl: 7d
    # 스케줄러가 메시지 캐시에서 제거할 기준 나이
    message-retention: 7d
  scheduler:
    # 캐시에서 만료 메시지 제거(매일 03:00)
    message-cleanup:
      cron: "0 0 3 * * *"
    # 인기방 zset 재구축(3시간마다)
    popularity-refresh:
      cron: "0 0 */3 * * *"
    # 방 activity projection 반영 주기. flush 간격이 곧 "내 방 목록이 최신으로 올라오기까지"
    # 허용하는 지연이다. reclaim 은 claim 한 채 죽은 방을 Mongo 기준으로 회수한다.
    room-activity-projection:
      flush-delay-ms: 500
      reclaim-delay-ms: 10000
  popular-room:
    # Redis 인기방 zset 에 담는 상위 방 개수
    index-size: 100
  my-room:
    # Redis 내 방 정렬 인덱스가 비었을 때 Mongo 기준으로 재생성하는 상위 방 수.
    # membership 전체와 방을 batch 조회해 점수를 계산한 뒤 이 상한을 적용한다.
    rebuild-limit: 300
  room-activity-projection:
    # flush 한 번에 가져오는 dirty 방 수 상한
    claim-batch-size: 200
    # claim 한 방을 처리하지 못한 채 죽었다고 보는 기준. 지나면 Mongo 기준 재생성으로 회수한다
    claim-timeout-ms: 30000
    # 회수 한 번에 처리하는 방 수 상한
    reclaim-batch-size: 200
  retry:
    # Outbox/Mongo 일시 실패 재시도(@Retryable). 소진 시 DLQ 로 전이
    max-attempts: 3
    backoff-delay-ms: 100
    backoff-multiplier: 2

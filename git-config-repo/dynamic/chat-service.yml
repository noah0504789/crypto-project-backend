server:
  port: 8080
  version: v1
  servlet:
    context-path: /api/${server.version}
    encoding:
      charset: UTF-8
      force: true

grpc:
  server:
    port: 18080

api-path:
  chat:
    base: ${api-contract.chat.base}
    rooms-popular: ${api-contract.chat.rooms-popular}
    rooms-me: ${api-contract.chat.rooms-me}
    room: ${api-contract.chat.room}
    room-me: ${api-contract.chat.room-me}
    room-members: ${api-contract.chat.room-members}
    room-activity: ${api-contract.chat.room-activity}
    room-create: ${api-contract.chat.room-create}
    room-messages: ${api-contract.chat.room-messages}

spring:
  messages:
    basename: messages,common-validation-messages
    encoding: UTF-8
  jpa:
#    show-sql: true
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
#        generate_statistics: true
        format_sql: true
        use_sql_comments: true
    defer-datasource-initialization: true
    open-in-view: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  cloud:
    function:
      definition: chatRoomEventConsumer;chatMessageEventConsumer;chatRoomDlqEventConsumer;chatMessageDlqEventConsumer
    stream:
      bindings:
        chatRoomEventConsumer-in-0:
          destination: chatroom-event
          contentType: application/json
          group: chat
        chatMessageEventConsumer-in-0:
          destination: chatmessage-event
          contentType: application/json
          group: chat
        chatRoomDlqEventConsumer-in-0:
          destination: chatroom-event.dlq
          contentType: application/json
          group: chat
        chatMessageDlqEventConsumer-in-0:
          destination: chatmessage-event.dlq
          contentType: application/json
          group: chat
      kafka:
        binder:
          consumer-properties:
            spring.json.trusted.packages: "*"
        bindings:
          chatRoomEventConsumer-in-0:
            consumer:
              reset-offsets: false
              start-offset: latest
              ack-mode: record
          chatMessageEventConsumer-in-0:
            consumer:
              reset-offsets: false
              start-offset: latest
              ack-mode: record
          chatRoomDlqEventConsumer-in-0:
            consumer:
              reset-offsets: false
              start-offset: latest
              ack-mode: record
          chatMessageDlqEventConsumer-in-0:
            consumer:
              reset-offsets: false
              start-offset: latest
              ack-mode: record

mysql:
  username: ${mysql.event.username}
  password: ${mysql.event.password}
  db: ${mysql.event.db}
  write:
    pool:
      max-size: 120
      min-idle: 120
      connection-timeout: 3500

mongo:
  user: ${mongo.chat.username}
  pass: ${mongo.chat.password}
  db: ${mongo.chat.db}
  authSource: chat

chat:
  cache:
    # 방 정보 hash 의 Redis TTL
    room-ttl: 7d
    # 스케줄러가 메시지 캐시에서 제거할 기준 나이
    message-retention: 7d
  scheduler:
    # 캐시에서 만료 메시지 제거(매일 03:00)
    message-cleanup:
      cron: "0 0 3 * * *"
    # 인기방 zset 재구축(3시간마다)
    popularity-refresh:
      cron: "0 0 */3 * * *"
  popular-room:
    # Redis 인기방 zset 에 담는 상위 방 개수
    index-size: 100
  retry:
    # Outbox/Mongo 일시 실패 재시도(@Retryable). 소진 시 DLQ 로 전이
    max-attempts: 3
    backoff-delay-ms: 100
    backoff-multiplier: 2

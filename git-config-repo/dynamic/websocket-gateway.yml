server:
  port: 8100

grpc:
  client:
    chat-client:
      address: ${uri.discovery.chat-service}
      negotiation-type: plaintext
      max-inbound-message-size:
        bytes: 16777216 # 16MB
#      enable-keep-alive: true
#      keep-alive-time:
#        seconds: 30
  server:
    enabled: false

api-path:
  websocket:
    sock-js-endpoint: ${api-contract.websocket.sock-js-endpoint}
    native-endpoint: ${api-contract.websocket.native-endpoint}
  stomp:
    application-destination-prefix: ${api-contract.websocket.application-destination-prefix}
    user-destination-prefix: ${api-contract.websocket.user-destination-prefix}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  cloud:
    function:
      definition: myChatRoomBadgeBroadcastEventConsumer;chatMessageBroadcastEventConsumer;webNotificationBroadcastEventConsumer
    stream:
      bindings:
        myChatRoomBadgeBroadcastEventConsumer-in-0:
          destination: chatroom-broadcast-event
          contentType: application/json
          group: chatroom-broadcast-event-${app.instance-id}
          consumer:
            concurrency: 2
        chatMessageBroadcastEventConsumer-in-0:
          destination: chatmessage-broadcast-event
          contentType: application/json
          group: chatmessage-broadcast-${app.instance-id}
          consumer:
            concurrency: 2
        webNotificationBroadcastEventConsumer-in-0:
          destination: web-notification-broadcast-event
          contentType: application/json
          group: web-notification-broadcast-${app.instance-id}
          consumer:
            concurrency: 2
      kafka:
        binder:
          consumer-properties:
            spring.json.trusted.packages: "*"
        bindings:
          myChatRoomBadgeBroadcastEventConsumer-in-0:
            consumer:
              reset-offsets: false
              start-offset: latest
              ack-mode: record
          chatMessageBroadcastEventConsumer-in-0:
            consumer:
              reset-offsets: false
              start-offset: latest
              ack-mode: record
          webNotificationBroadcastEventConsumer-in-0:
            consumer:
              reset-offsets: false
              start-offset: latest
              ack-mode: record

websocket:
  session:
    # STOMP 세션 위치 Redis TTL(연결 유휴 만료. subscribe 마다 갱신)
    ttl: 3m
  stomp:
    # 주의: dynamic/ 이지만 busrefresh 로는 반영되지 않는다. 풀은 ThreadPoolTaskExecutor.initialize()
    # 시점에 만들어지고 이 코드베이스는 @RefreshScope 를 쓰지 않아, 리바인딩된 값을 풀에 다시 넣어줄
    # 지점이 없다(큐 용량은 LinkedBlockingQueue 고정이라 애초에 런타임 변경 불가). 값 변경은 재배포로 반영한다.
    # core = max 인 이유와 큐 산정 근거는 docs/decisions/ADR-003-chat-capacity-target-and-connection-budget.md
    executor:
      inbound:  { core-size: 32, max-size: 32, queue-capacity: 600 }
      # TODO(5.7): 스레드 수만 바꾸는 실험값이다. 큐(3000)는 의도적으로 고정한다.
      # VU 80 동일 조건 실측:
      #   64 → 활성 5/64,  거절 17,250, 큐 3,000 포화, 미도달 10,409, p90  5,951ms
      #   16 → 활성 8/16,  거절  5,413, 큐 1,649,      미도달    320, p90 10,649ms
      # 스레드를 1/4 로 줄였더니 활용률이 7.8% → 50% 로 오르고 거절이 1/3 로 줄었다.
      # 다만 소화 속도가 부족해 버려지던 것이 지연 도착으로 바뀌었다(늦게 도착 0 → 81,544).
      # 최적점이 두 값 사이에 있다고 보고 32 를 잰다.
      broker:   { core-size: 32, max-size: 32, queue-capacity: 3000 }
      # TODO(5.10): broker 에서 검증된 패턴을 outbound 에 적용한다. 큐(30000)는 고정한다.
      # 클라우드 k6 분리 후 VU 80 측정에서 outbound 만 밀렸다 — 큐 4,232, 활성 스레드 17/96(17.7%).
      # broker 가 64 스레드일 때 활성 5/64(7.8%)로 막혔던 것과 같은 구간이고, 32 로 줄여 해결됐다.
      # 소비자 스레드가 단일 LinkedBlockingQueue 의 takeLock 을 두고 경합하는 구조가 같다.
      outbound: { core-size: 32, max-size: 32, queue-capacity: 30000 }
      ack:      { core-size: 16, max-size: 16, queue-capacity: 2000 }

app:
  rate-limit:
    chat-message:
      # TODO(1.13): 팬아웃 용량 재측정을 위해 일시적으로 끈 상태다. 측정이 끝나면 true 로 되돌린다.
      # 켜두면 측정이 불가능하다 — 전원이 한 방에 있고 계정을 공유하므로 user 버킷(3/s)에서 대부분 잘려
      # 팬아웃이 아니라 rate limiter 를 재게 된다. rate limit 자체 검증은 VU 별 계정을 공급한 별도 실행에서 한다.
      # busrefresh 로는 반영되지 않는다(불변 record 라 리바인딩이 limiter 가 든 참조를 바꾸지 못한다). 재배포 필요.
      enabled: false
      user:
        replenish-rate: 3
        burst-capacity: 5
      room:
        replenish-rate: 30
        burst-capacity: 10
  grpc:
    chat-client:
      deadline: 10s

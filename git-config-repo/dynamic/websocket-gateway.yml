server:
  port: 8100

grpc:
  client:
    chat-client:
      address: ${uri.discovery.chat-service}
      negotiation-type: plaintext
      max-inbound-message-size:
        bytes: 16777216 # 16MB
#      enable-keep-alive: true
#      keep-alive-time:
#        seconds: 30
  server:
    enabled: false

api-path:
  websocket:
    sock-js-endpoint: ${api-contract.websocket.sock-js-endpoint}
    native-endpoint: ${api-contract.websocket.native-endpoint}
  stomp:
    application-destination-prefix: ${api-contract.websocket.application-destination-prefix}
    user-destination-prefix: ${api-contract.websocket.user-destination-prefix}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  cloud:
    function:
      definition: myChatRoomBadgeBroadcastEventConsumer;chatMessageBroadcastEventConsumer;webNotificationBroadcastEventConsumer
    stream:
      bindings:
        myChatRoomBadgeBroadcastEventConsumer-in-0:
          destination: chatroom-broadcast-event
          contentType: application/json
          group: chatroom-broadcast-event-${app.instance-id}
          consumer:
            concurrency: 2
        chatMessageBroadcastEventConsumer-in-0:
          destination: chatmessage-broadcast-event
          contentType: application/json
          group: chatmessage-broadcast-${app.instance-id}
          consumer:
            concurrency: 2
        webNotificationBroadcastEventConsumer-in-0:
          destination: web-notification-broadcast-event
          contentType: application/json
          group: web-notification-broadcast-${app.instance-id}
          consumer:
            concurrency: 2
      kafka:
        binder:
          consumer-properties:
            spring.json.trusted.packages: "*"
        bindings:
          myChatRoomBadgeBroadcastEventConsumer-in-0:
            consumer:
              reset-offsets: false
              start-offset: latest
              ack-mode: record
          chatMessageBroadcastEventConsumer-in-0:
            consumer:
              reset-offsets: false
              start-offset: latest
              ack-mode: record
          webNotificationBroadcastEventConsumer-in-0:
            consumer:
              reset-offsets: false
              start-offset: latest
              ack-mode: record

websocket:
  session:
    # 연결 유휴 만료. subscribe 마다 갱신된다.
    ttl: 3m

  # 이 아래 값들은 busrefresh 로 반영되지 않는다. 풀은 initialize() 시점에, 스케줄러는
  # @PostConstruct 에서 만들어지고 @RefreshScope 를 쓰지 않는다. 값 변경은 재배포로 반영한다.
  stomp:
    # core = max 인 이유와 큐 크기 산정 근거는 docs/decisions/ADR-003-chat-capacity-target-and-connection-budget.md
    # 스레드 수는 실험으로 확정했다 — broker 64→16→32, outbound 96→32→64 (PR #258~#261)
    executor:
      inbound:  { core-size: 32, max-size: 32, queue-capacity: 600 }
      broker:   { core-size: 32, max-size: 32, queue-capacity: 3000 }
      outbound: { core-size: 64, max-size: 64, queue-capacity: 30000 }
      ack:      { core-size: 16, max-size: 16, queue-capacity: 2000 }

  # 방 단위 conflation. 구간의 마지막 1건만 보내고 나머지는 버린다. 근거는 PR #263, 유지 이유는 chat/load-test-results/chatmessage/websocket-gateway/README.md §3-0
  badge:
    coalesce:
      enabled: true
      window-ms: 200

  chat-message:
    # 방 단위 배칭. conflation 과 달리 한 건도 버리지 않는다. 근거는 PR #265, 유지 이유는 chat/load-test-results/chatmessage/websocket-gateway/README.md §3-0
    # window-ms 를 뱃지(200ms)보다 짧게 잡는다 — 메시지는 사용자가 기다리는 내용이다.
    batch:
      enabled: true
      window-ms: 100
      max-batch-size: 300

    # ACK 를 brokerChannel 없이 clientOutboundChannel 로 직접 보낸다. 근거는 PR #267, 유지 이유는 chat/load-test-results/chatmessage/websocket-gateway/README.md §3-0
    # 세션·구독 정보가 없으면 기존 경로로 넘긴다(chat.message.ack.direct.fallback 로 관측).
    ack:
      direct:
        enabled: true

app:
  rate-limit:
    chat-message:
      # 측정용으로 꺼 둔 상태다. 되돌려야 한다 — 이유와 절차는 TODO.md 1.13
      enabled: false
      user:
        replenish-rate: 3
        burst-capacity: 5
      room:
        replenish-rate: 30
        burst-capacity: 10
  grpc:
    chat-client:
      deadline: 10s

server:
  port: 8000
  http2:
    enabled: true
  ssl:
    enabled: true
    key-store-type: PKCS12
    key-store: file:/certs/keystore.p12
    key-store-password: ${ssl.key-store-password}
    key-password: ${ssl.key-password}
    key-alias: localhost

grpc:
  client:
    oauth2-authorization-server-client:
      address: ${uri.discovery.oauth2-authorization-server}
      negotiation-type: plaintext
      max-inbound-message-size:
        bytes: 16777216 # 16MB

api-path:
  actuator-pattern: /actuator/**
  options-pattern: /**
  auth:
    pattern: ${api-contract.auth.pattern}
    logout: ${api-contract.auth.logout}
    refresh: ${api-contract.auth.refresh}
  user:
    base: ${api-contract.user.base}
    sign-up: ${api-contract.user.sign-up}
    me: ${api-contract.user.me}
    profile: ${api-contract.user.profile}
  chat:
    pattern: ${api-contract.chat.pattern}
    rooms-popular: ${api-contract.chat.base}${api-contract.chat.rooms-popular}
    rooms-me: ${api-contract.chat.rooms-me-path}
    room-create: ${api-contract.chat.room-create-path}
    room-pattern: ${api-contract.chat.room-pattern}
    room-me-pattern: ${api-contract.chat.room-me-pattern}
    room-members-pattern: ${api-contract.chat.room-members-pattern}
    room-activity-pattern: ${api-contract.chat.room-activity-pattern}
    room-messages-pattern: ${api-contract.chat.room-messages-pattern}
  market:
    markets: ${api-contract.market.markets}
    markets-pattern: ${api-contract.market.markets-pattern}
    price-alerts: ${api-contract.market.price-alerts}
    price-alerts-pattern: ${api-contract.market.price-alerts-pattern}
  notification:
    notifications: ${api-contract.notification.base}
    notifications-pattern: ${api-contract.notification.pattern}
  oauth2:
    pattern: ${api-contract.oauth2.pattern}
    authorization-pattern: ${api-contract.oauth2.authorization-pattern}
    login-callback-pattern: ${api-contract.oauth2.login-callback-pattern}
    login-callback-base-uri: ${api-contract.oauth2.login-callback-base-uri}
  websocket:
    prefix: ${api-contract.websocket.sock-js-endpoint}
    pattern: ${api-contract.websocket.pattern}
    info-pattern: ${api-contract.websocket.info-pattern}
    native-path: ${api-contract.websocket.native-endpoint}
    native-pattern: ${api-contract.websocket.native-pattern}
    msg-pattern: ${api-contract.websocket.message-pattern}
  route:
    user-api-version: v1
    chat-api-version: v1
    market-api-version: v1
    notification-api-version: v1

gateway:
  rate-limit:
    sign-up:
      replenish-rate: 5
      burst-capacity: 120
      requested-tokens: 60
    oauth2-authorization:
      replenish-rate: 10
      burst-capacity: 180
      requested-tokens: 60
    oauth2-callback:
      replenish-rate: 20
      burst-capacity: 300
      requested-tokens: 60
    token-refresh:
      replenish-rate: 10
      burst-capacity: 180
      requested-tokens: 60
    logout:
      replenish-rate: 20
      burst-capacity: 100
      requested-tokens: 20
    websocket-handshake:
      # TODO(1.14): 팬아웃 재측정을 위해 일시 상향한 상태다. 측정이 끝나면 2/5/1 로 되돌린다.
      # 원래 값(burst 5)에서는 측정이 불가능하다 — k6 가 계정 2개를 전 VU 가 공유하는 구조라
      # 사용자별 버킷이 계정당 5개만 통과시키고 나머지 연결을 잘라낸다(20 VU 실행에서
      # `ws upgrade status is 101` 이 정확히 ✓10/✗10). VU 를 올려도 10개만 붙어 팬아웃이 안 생긴다.
      # 핸드셰이크는 연결 시 1회만 검사하므로(전송은 이미 열린 소켓을 쓴다) 이 값은 팬아웃
      # 처리량 측정 경로에 영향을 주지 않는다. 근본 해결은 VU별 자격증명 공급(→ 5.4).
      replenish-rate: 100
      burst-capacity: 300
      requested-tokens: 1
    command:
      replenish-rate: 2
      burst-capacity: 5
      requested-tokens: 1
    query:
      replenish-rate: 10
      burst-capacity: 20
      requested-tokens: 1
    public-query:
      replenish-rate: 20
      burst-capacity: 40
      requested-tokens: 1

app:
  grpc:
    oauth2-authorization-server-client:
      deadline: 3500ms

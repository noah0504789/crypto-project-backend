server:
  port: 8300
  version: v1
  servlet:
    context-path: /api/${server.version}
    encoding:
      charset: UTF-8
      force: true

api-path:
  notification:
    me: ${api-contract.notification.me}
    read: ${api-contract.notification.read}

spring:
  cloud:
    function:
      definition: priceAlertDetectedEventConsumer;notificationEventConsumer
    stream:
      bindings:
        priceAlertDetectedEventConsumer-in-0:
          destination: price-alert-detected-event
          content-type: application/json
          group: notification
        notificationEventConsumer-in-0:
          destination: notification-event
          content-type: application/json
          group: notification
        web-notification-broadcast-event-out:
          destination: web-notification-broadcast-event
          content-type: application/json
#      kafka:
#        binder:
#          transaction:
#            transaction-id-prefix: tx-notification-${app.instance-id}

mongo:
  user: ${mongo.notification.username}
  pass: ${mongo.notification.password}
  db: ${mongo.notification.db}
  authSource: notification

notification:
  cache:
    # 알림 정보 hash 의 Redis TTL(콜드 항목 상한. 실제 교체는 서버 LFU 축출)
    ttl: 7d

server.port: 8500

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  cloud:
    function:
      definition: priceAlertDetectionProcessor
    stream:
      bindings:
        priceAlertDetectionProcessor-in-0:
          destination: upbit-ticker-event
          content-type: application/json
          group: upbit-ticker-alert
        priceAlertDetectionProcessor-out-0:
          destination: price-alert-detected-event
          content-type: application/json
      kafka:
        streams:
          binder:
            configuration:
              processing.guarantee: exactly_once_v2
            # 함수 이름이 바뀌어도 소비 그룹과 state store 디렉터리가 유지되도록 고정한다.
            application-id: market-detection

price-alert-detection:
  window-minutes: 3
  max-event-age: 10s

  store:
    name: upbit-ticker-store
    # 조회 범위 [t-3m, t] 의 가장 오래된 표본이 만료 경계에 걸리지 않도록 window 보다 크게 둔다.
    # 만료는 wall clock 이 아니라 task 별 stream time 기준이라, 한 종목이 조용한 사이
    # 다른 종목이 stream time 을 밀어올리면 조용한 종목의 표본이 먼저 잘린다.
    retention: 5m
    window-size: 3m
    retain-duplicates: false

jwt:
  key-name: my-authorization-server-jwt
  key-version: 1
  issuer-uri: ${uri.internal.oauth2-authorization-server}
  jwks-uri: ${uri.internal.config-server}/.well-known/jwks.json?keyName=${jwt.key-name}
  sign-uri: ${uri.internal.config-server}/sign
  access-token-expiration-ms: 7200000 # 2시간
  refresh-token-expiration-ms: 604800000 # 7일
  connect-timeout-ms: 2000
  read-timeout-ms: 3000

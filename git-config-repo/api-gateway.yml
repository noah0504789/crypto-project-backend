server:
  port: 8000
  http2:
    enabled: true
  ssl:
    enabled: true
    key-store-type: PKCS12
    key-store: file:/certs/keystore.p12
    key-store-password: ${ssl.key-store-password}
    key-password: ${ssl.key-password}
    key-alias: localhost

grpc:
  client:
    oauth2-authorization-server-client:
      address: discovery:///oauth2-authorization-server
      negotiation-type: plaintext
      max-inbound-message-size:
        bytes: 16777216 # 16MB

api-path:
  actuator-pattern: /actuator/**
  options-pattern: /**
  auth:
    pattern: /auth/**
  user:
    pattern: /user/**
    me: /user/me
    profile-pattern: /user/*/profile
  chat:
    pattern: /chat/**
    rooms-me: /chat/rooms/me
    room-me-pattern: /chat/room/me/*
    room-members-pattern: /chat/room/*/members
    room-activity-pattern: /chat/room/*/activity
    room-messages-pattern: /chat/room/*/messages
  oauth2:
    pattern: /oauth2/**
    login-callback-pattern: /login/oauth2/code/**
    login-callback-base-uri: /login/oauth2/code/*
  websocket:
    prefix: /ws
    pattern: /ws/**
    info-pattern: /ws/info/**
    native-path: /ws-native
    native-pattern: /ws-native/**
    msg-pattern: /msg/**
  route:
    user-api-version: v1
    chat-api-version: v1

plugins {
    id 'crypto-bootstrap'
}

ext.dockerImageName = "crypto-chat-service"

dependencies {
    implementation project(':common:common-actuator-webmvc')
    implementation project(':chat:chat-domain')
    implementation project(':chat:chat-application')
    implementation project(':chat:chat-adapter-in')
    implementation project(':chat:chat-adapter-out')

    implementation(libs.spring.cloud.config.client)
    implementation(libs.spring.cloud.eureka.client)
    implementation(libs.spring.cloud.starter.bus.kafka)
    implementation(libs.micrometer.registry.prometheus)

    testImplementation project(':common:common-test')
    // RedissonClient 타입 참조(@MockitoBean)용 컴파일 전용. 런타임 redisson은 앱 의존으로 이미 있고,
    // testImplementation으로 넣으면 redisson starter의 lettuce 제외가 testRuntime에 전파돼 lettuce가 빠진다.
    testCompileOnly project(':common:common-redisson')
}
spring:
  application:
    name: chat-service

  config:
    import: ""

  cloud:
    config:
      enabled: false
      fail-fast: false
      import-check:
        enabled: false
    discovery:
      enabled: false

  data:
    redis:
      host: localhost
      port: 6379

    mongodb:
      uri: mongodb://localhost:27017/test

eureka:
  client:
    enabled: false

api-path:
  chat:
    base: /chat
    rooms-popular: /rooms/popular
    rooms-me: /rooms/me
    room: /room/{roomId}
    room-me: /room/{roomId}/me
    room-members: /room/{roomId}/members
    room-activity: /room/{roomId}/activity
    room-create: /room
    room-messages: /room/{roomId}/messages

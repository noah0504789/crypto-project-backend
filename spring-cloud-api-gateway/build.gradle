plugins {
    id 'crypto-bootstrap'
}

ext.dockerImageName = "crypto-spring-cloud-api-gateway"

dependencies {
    implementation project(':common:common-core')
    implementation project(':common:common-actuator-webflux')
    implementation project(':oauth2-authorization-server:oauth2-authorization-server-client')

    runtimeOnly(libs.grpc.netty)
    runtimeOnly(libs.grpc.client.spring.boot.starter)

    implementation(libs.spring.boot.starter.webflux)
    implementation(libs.spring.boot.starter.security)
    implementation(libs.spring.security.oauth2.jose)
    implementation(libs.spring.security.oauth2.resource.server)

    implementation(libs.spring.cloud.config.client)
    implementation(libs.spring.cloud.eureka.client)
    implementation(libs.spring.cloud.gateway)
    implementation(libs.spring.cloud.loadbalancer)
    implementation(libs.spring.cloud.starter.bus.kafka)

    testImplementation project(':common:common-test')
    testImplementation(libs.spring.security.test)
    testImplementation(libs.reactor.test)
}
plugins {
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.protobuf)
}

group = 'org.example'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
//    querydsl.extendsFrom compileClasspath
}

dependencies {
    compileOnly(libs.tomcat.annotations.api)

    api(platform(libs.grpc.bom))
    api(libs.grpc.protobuf)
    api(libs.grpc.stub)
    api(libs.protobuf.java)
    api(libs.protobuf.util)

    testImplementation(platform(libs.junit.bom))
    testImplementation(libs.junit.jupiter)
}

def catalog = extensions.getByType(VersionCatalogsExtension).named('libs')
def protocVersion = catalog.findVersion('protobuf').get().requiredVersion
def grpcCodegenVersion = catalog.findVersion('grpc').get().requiredVersion

protobuf {
    protoc {artifact = "com.google.protobuf:protoc:${protocVersion}"}
    plugins {grpc {artifact = "io.grpc:protoc-gen-grpc-java:${grpcCodegenVersion}"}}
    generateProtoTasks {all()*.plugins { grpc {} }}
}

publishing {
    publications {
        create('chatmessageV1Stubs', MavenPublication) {
            from components.java
            artifactId = 'protos'
        }
    }
    repositories {
        mavenLocal()
    }
}

test {
    useJUnitPlatform()
}
